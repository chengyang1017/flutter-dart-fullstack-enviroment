name: flutter_ui_playground
description: A safe, restricted Flutter widget syntax playground.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  analyzer: ^8.4.1
  archive: ^4.2.0
  http: ^1.2.2
  universal_html: ^2.3.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  yaml: ^3.1.3
  file_picker: ^10.3.10
  flutter_monaco: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lessons/
