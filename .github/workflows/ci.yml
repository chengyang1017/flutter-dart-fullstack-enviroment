name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test

  runner-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-runner-server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: dart --version
      - name: Install runner dependencies
        run: dart pub get
      - name: Analyze runner server
        run: dart analyze

  workspace-storage-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace-storage-server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: dart --version
      - name: Install storage dependencies
        run: dart pub get
      - name: Analyze workspace storage server
        run: dart analyze
      - name: Run workspace storage tests
        run: dart test

  serverpod-mini-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Install Serverpod CLI 3.4.13
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Run real Serverpod Mini smoke test
        run: flutter test tool/serverpod_mini_smoke_test.dart
