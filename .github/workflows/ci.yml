name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze workbench
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Run tests
        run: flutter test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: Generate Jaspr client options
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze admin app
        run: dart analyze

  flutterpractice-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/flutterpractice_cli
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Analyze CLI
        run: dart analyze
      - name: Run CLI tests
        run: dart test

  runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flutter-runner
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: Analyze runner
        run: dart analyze

  workspace-storage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workspace-storage
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: Analyze storage service
        run: dart analyze

  serverpod-mini-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Install Serverpod CLI 3.4.13
        run: dart pub global activate serverpod_cli 3.4.13
      - name: Run Serverpod Mini smoke test
        run: flutter test tool/serverpod_mini_smoke_test.dart
